name: CI

# Lints and tests the game on every push/PR. Also exposed as a reusable
# workflow (workflow_call) so deploy.yml can run these same checks as a
# required job via `needs:` and skip deploying if they fail — a plain
# workflow_run trigger would only fire once this file existed on the
# repo's default branch, which doesn't hold for a claude/** feature
# branch that deploys directly, so workflow_call is used instead.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
