name: CI

# Lints and tests the game on every push/PR so a broken change is caught
# before it can reach deploy.yml. Doesn't gate deploy.yml itself (that
# workflow has its own trigger), but a red check here is a clear signal
# not to merge/deploy.
on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
