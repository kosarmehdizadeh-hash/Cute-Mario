name: Deploy to server

# Runs on every push to any claude/* branch (covers every future session's
# branch automatically, without needing to edit this file each time), or
# manually from the Actions tab.
on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Supabase anon key
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE secret is not set — high scores won't work."
            exit 1
          fi
          sed -i "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|g" index.html

      - name: Copy project files to server via SCP (password auth)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
