name: Deploy to server

# Gated on CI: this only runs once the "CI" workflow (lint + tests) has
# completed successfully for a claude/** branch, so a red check never
# gets auto-deployed. `workflow_dispatch` remains available as a manual
# override from the Actions tab.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Copy project files to server via SCP (SSH key auth)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
