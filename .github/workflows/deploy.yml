name: Deploy to server

# Runs on every push to these branches, or manually from the Actions tab.
on:
  push:
    branches:
      - claude/festive-pasteur-rbjsim
      - claude/nifty-galileo-29iff7
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project files to server via SCP (password auth)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
