name: Deploy to server

# Runs on every push to any claude/* branch (covers every future session's
# branch automatically, without needing to edit this file each time), or
# manually from the Actions tab. The `ci` job below reuses ci.yml's own
# lint+test job (via workflow_call) as a required dependency, so `deploy`
# is skipped whenever lint/tests fail — no red build ever gets shipped.
on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project files to server via SCP (SSH key auth)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
