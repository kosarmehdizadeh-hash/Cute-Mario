name: Generate sound effects

# Manual only — calls the ElevenLabs API (which costs credits), so it should
# never run automatically on every push. Run it from the Actions tab whenever
# the sound set needs to be (re)generated.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate sound effects via ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/generate_sfx.py

      - name: Commit and push generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/sfx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate game sound effects via ElevenLabs"
            git push origin HEAD:${{ github.ref_name }}
          fi
