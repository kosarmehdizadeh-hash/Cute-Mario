<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blip's Big Adventure — Cute Platformer</title>
<style>
  /* ============================================================
     GLOBAL / PAGE STYLING
     A soft pastel page background that frames the game canvas.
     ============================================================ */
  :root{
    --ink:#4a3f35;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: linear-gradient(160deg,#fdf6ff 0%, #eafcff 100%);
    font-family:'Baloo 2','Comic Sans MS','Trebuchet MS',sans-serif;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }

  /* The game "frame" — keeps a fixed 960x540 aspect ratio but scales
     responsively to fit smaller screens. */
  #game-wrap{
    position:relative;
    width:95vw; max-width:960px;
    aspect-ratio: 960 / 540;
    border-radius:28px;
    overflow:hidden;
    box-shadow:
      0 18px 40px rgba(120,90,160,0.25),
      0 0 0 10px #ffffff,
      0 0 0 14px #ffd6ec;
  }
  canvas{
    display:block;
    width:100%; height:100%;
    background:#bfe8ff; /* fallback while first frame paints */
  }

  /* ---------- HUD (score pill + control hint) ---------- */
  #hud{
    position:absolute; top:14px; left:14px;
    pointer-events:none;
  }
  #score-pill{
    background:#fff; padding:8px 16px; border-radius:999px;
    font-weight:700; font-size:18px;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
  }
  #hint{
    position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.85); padding:6px 16px; border-radius:999px;
    font-size:12.5px; font-weight:700; white-space:nowrap;
    pointer-events:none;
  }

  /* ---------- Start / Win overlays ---------- */
  .overlay{
    position:absolute; inset:0;
    background:rgba(60,40,80,0.45);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(2px);
  }
  .overlay.hidden{ display:none; }
  .panel{
    background:#fff; border-radius:24px; padding:32px 40px;
    text-align:center; max-width:80%;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
  }
  .panel h1{ margin:0 0 6px; font-size:26px; }
  .panel .sub{ margin:0 0 18px; color:#8a7a75; font-size:14.5px; }
  .controls{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .ctrl-row{ font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .key{
    background:#f1eafd; border:2px solid #d9c9fb; border-radius:8px;
    padding:3px 10px; font-weight:700; font-size:13px;
  }
  button{
    background:linear-gradient(180deg,#ffb84c,#ff9a3c);
    border:none; color:#fff; font-weight:700; font-size:16px;
    padding:12px 28px; border-radius:999px; cursor:pointer;
    box-shadow:0 6px 0 #d9781f;
    font-family:inherit;
    transition:transform 0.08s;
  }
  button:hover{ transform:translateY(-2px); }
  button:active{ transform:translateY(3px); box-shadow:0 2px 0 #d9781f; }
</style>
</head>
<body>

  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- Score HUD -->
    <div id="hud">
      <div id="score-pill">⭐ <span id="score">0</span> / <span id="score-total">0</span></div>
    </div>
    <div id="hint">⬅️➡️ walk · hold <b>Shift</b> to run · <b>Space</b>/⬆️ to jump</div>

    <!-- Start screen -->
    <div id="start-screen" class="overlay">
      <div class="panel">
        <h1>🌟 Blip's Big Adventure 🌟</h1>
        <p class="sub">Help the little cloud-blob reach the flag!</p>
        <div class="controls">
          <div class="ctrl-row"><span class="key">⬅️ ➡️</span> Walk</div>
          <div class="ctrl-row"><span class="key">Shift</span> + ⬅️➡️ Run</div>
          <div class="ctrl-row"><span class="key">Space / ⬆️</span> Jump</div>
        </div>
        <button id="start-btn">Let's Go! ▶️</button>
      </div>
    </div>

    <!-- Win screen -->
    <div id="win-screen" class="overlay hidden">
      <div class="panel">
        <h1>🎉 You made it! 🎉</h1>
        <p class="sub" id="win-stats"></p>
        <button id="restart-btn">Play Again 🔁</button>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  /* ================================================================
     BLIP'S BIG ADVENTURE — a tiny cute 2D platformer
     Built with plain HTML5 Canvas + vanilla JS. No external assets.

     Code map:
       1. Canvas & physics constants
       2. Level data (ground, platforms, coins, flag)
       3. Player object
       4. Input handling
       5. Collision + physics update
       6. Sound (WebAudio beeps)
       7. Rendering (background, level, player)
       8. Main loop + UI wiring
     ================================================================ */


  // ---------------------------------------------------------------
  // 1. CANVAS & PHYSICS CONSTANTS
  // ---------------------------------------------------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;   // internal game resolution (CSS scales it responsively)
  const H = canvas.height;

  const GRAVITY          = 0.62;   // downward acceleration per frame
  const MAX_FALL_SPEED   = 16;     // terminal velocity
  const WALK_ACCEL       = 0.5;
  const RUN_ACCEL        = 0.65;
  const WALK_MAX_SPEED   = 3.4;
  const RUN_MAX_SPEED    = 6.4;
  const GROUND_FRICTION  = 0.62;   // deceleration when no key held & grounded
  const AIR_FRICTION     = 0.3;    // gentler deceleration mid-air
  const JUMP_VELOCITY    = -13.2;  // initial upward velocity on jump
  const JUMP_CUT_FACTOR  = 0.45;   // releasing jump early shortens the hop

  function randRange(a, b){ return a + Math.random() * (b - a); }


  // ---------------------------------------------------------------
  // 2. LEVEL DATA
  // ---------------------------------------------------------------
  const GROUND_Y    = H - 90;     // y-coordinate of the top of the ground
  const LEVEL_WIDTH = 3400;       // total width of the scrolling level

  // Floating candy-colored platforms at varying heights, forming a
  // loose staircase across the level so the player can test jumping.
  const platforms = [
    { x:300,  y:GROUND_Y-110, w:140, h:28, color:'#ff9ecb', top:'#ffc4e0' },
    { x:560,  y:GROUND_Y-190, w:120, h:28, color:'#9ecbff', top:'#c4e0ff' },
    { x:760,  y:GROUND_Y-260, w:120, h:28, color:'#ffe39e', top:'#fff0c4' },
    { x:1020, y:GROUND_Y-150, w:160, h:28, color:'#b7f0a8', top:'#d8f8ce' },
    { x:1300, y:GROUND_Y-220, w:100, h:28, color:'#ff9ecb', top:'#ffc4e0' },
    { x:1500, y:GROUND_Y-300, w:100, h:28, color:'#9ecbff', top:'#c4e0ff' },
    { x:1700, y:GROUND_Y-220, w:100, h:28, color:'#ffe39e', top:'#fff0c4' },
    { x:1900, y:GROUND_Y-130, w:200, h:28, color:'#b7f0a8', top:'#d8f8ce' },
    { x:2200, y:GROUND_Y-200, w:120, h:28, color:'#ff9ecb', top:'#ffc4e0' },
    { x:2420, y:GROUND_Y-280, w:120, h:28, color:'#9ecbff', top:'#c4e0ff' },
    { x:2650, y:GROUND_Y-190, w:140, h:28, color:'#ffe39e', top:'#fff0c4' },
    { x:2900, y:GROUND_Y-110, w:160, h:28, color:'#b7f0a8', top:'#d8f8ce' },
  ];

  // The ground is just one big solid rectangle spanning the level.
  const ground = { x:0, y:GROUND_Y, w:LEVEL_WIDTH, h:(H-GROUND_Y)+60 };

  // Everything the player can stand on / bump into.
  const solids = [ground, ...platforms];

  // Collectible stars, sprinkled near the platforms.
  const coins = [];
  [
    [340,GROUND_Y-160],[600,GROUND_Y-240],[800,GROUND_Y-310],
    [1060,GROUND_Y-200],[1100,GROUND_Y-200],[1340,GROUND_Y-270],
    [1540,GROUND_Y-350],[1740,GROUND_Y-270],[1960,GROUND_Y-180],
    [2000,GROUND_Y-180],[2240,GROUND_Y-250],[2460,GROUND_Y-330],
    [2690,GROUND_Y-240],[2940,GROUND_Y-160],[2980,GROUND_Y-160],
  ].forEach(([x,y]) => coins.push({ x, y, r:11, collected:false, bob:Math.random()*Math.PI*2 }));

  const FLAG_X = LEVEL_WIDTH - 120; // goal pole near the end of the level

  // Decorative parallax elements (purely visual, no collision).
  const cloudSpots = [];
  for(let i=0;i<16;i++){
    cloudSpots.push({ x:randRange(0,LEVEL_WIDTH), y:randRange(40,150), s:randRange(0.7,1.3) });
  }
  const dirtDots = []; // precomputed so the dirt texture doesn't flicker every frame
  for(let i=0;i<260;i++){
    dirtDots.push({ x:randRange(0,LEVEL_WIDTH), y:randRange(GROUND_Y+30,H+20), r:randRange(2,5) });
  }


  // ---------------------------------------------------------------
  // 3. PLAYER
  // ---------------------------------------------------------------
  const player = {
    x:60, y:0, w:34, h:46,
    vx:0, vy:0,
    grounded:false,
    facing:1,        // 1 = facing right, -1 = facing left
    legPhase:0,      // drives the walk/run leg-bob animation
    squashT:0,       // 0..1 landing "squash" bounce timer
    blinkT:0,
    blinkTimer:randRange(2,5),
  };
  function resetPlayer(){
    player.x = 60; player.y = GROUND_Y - player.h;
    player.vx = 0; player.vy = 0;
    player.grounded = false; player.facing = 1;
    player.legPhase = 0; player.squashT = 0;
  }
  resetPlayer();

  let score = 0;
  let won = false;
  let cameraX = 0;


  // ---------------------------------------------------------------
  // 4. INPUT HANDLING
  // ---------------------------------------------------------------
  const keys = { left:false, right:false, jumpHeld:false, jumpReq:false, shift:false };

  window.addEventListener('keydown', (e) => {
    switch(e.code){
      case 'ArrowLeft':
        keys.left = true; e.preventDefault(); break;
      case 'ArrowRight':
        keys.right = true; e.preventDefault(); break;
      case 'ArrowUp':
      case 'Space':
        if(!keys.jumpHeld) keys.jumpReq = true; // only trigger on the initial press
        keys.jumpHeld = true;
        e.preventDefault();
        break;
      case 'ShiftLeft':
      case 'ShiftRight':
        keys.shift = true; break;
    }
  });
  window.addEventListener('keyup', (e) => {
    switch(e.code){
      case 'ArrowLeft':  keys.left = false; break;
      case 'ArrowRight': keys.right = false; break;
      case 'ArrowUp':
      case 'Space':      keys.jumpHeld = false; break;
      case 'ShiftLeft':
      case 'ShiftRight': keys.shift = false; break;
    }
  });


  // ---------------------------------------------------------------
  // 5. COLLISION + PHYSICS UPDATE
  // ---------------------------------------------------------------
  function aabbOverlap(a, b){
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // Horizontal and vertical movement are resolved as two separate
  // passes. This keeps collision simple and prevents the player from
  // getting stuck in corners (a common platformer pitfall).
  function moveX(dt){
    player.x += player.vx * dt;
    const box = { x:player.x, y:player.y, w:player.w, h:player.h };
    for(const s of solids){
      if(aabbOverlap(box, s)){
        if(player.vx > 0)      player.x = s.x - player.w; // hit from the left
        else if(player.vx < 0) player.x = s.x + s.w;       // hit from the right
        player.vx = 0;
        box.x = player.x;
      }
    }
    player.x = Math.max(0, Math.min(player.x, LEVEL_WIDTH - player.w));
  }

  function moveY(dt){
    player.y += player.vy * dt;
    player.grounded = false;
    const box = { x:player.x, y:player.y, w:player.w, h:player.h };
    for(const s of solids){
      if(aabbOverlap(box, s)){
        if(player.vy > 0){                 // falling -> land on top of solid
          player.y = s.y - player.h;
          if(player.vy > 8) player.squashT = 1; // big fall = juicy squash bounce
          player.vy = 0;
          player.grounded = true;
        } else if(player.vy < 0){          // rising -> bonk head on underside
          player.y = s.y + s.h;
          player.vy = 0;
        }
        box.y = player.y;
      }
    }
  }

  function update(dt){
    // --- Horizontal movement ---
    const running  = keys.shift;
    const maxSpeed = running ? RUN_MAX_SPEED : WALK_MAX_SPEED;
    const accel    = running ? RUN_ACCEL     : WALK_ACCEL;

    if(keys.left && !keys.right){
      player.vx -= accel * dt;
      player.facing = -1;
    } else if(keys.right && !keys.left){
      player.vx += accel * dt;
      player.facing = 1;
    } else {
      // No horizontal input: decelerate smoothly toward a stop.
      const f = player.grounded ? GROUND_FRICTION : AIR_FRICTION;
      if(player.vx > 0)      player.vx = Math.max(0, player.vx - f * dt);
      else if(player.vx < 0) player.vx = Math.min(0, player.vx + f * dt);
    }
    player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx));

    // --- Jumping ---
    if(keys.jumpReq && player.grounded){
      player.vy = JUMP_VELOCITY;
      player.grounded = false;
      playTone(660, 0.08, 'square', 0.05);
    }
    keys.jumpReq = false;

    // Variable jump height: letting go of the jump key early cuts the
    // upward velocity short, giving a smaller hop (like classic Mario).
    if(!keys.jumpHeld && player.vy < JUMP_VELOCITY * JUMP_CUT_FACTOR){
      player.vy = JUMP_VELOCITY * JUMP_CUT_FACTOR;
    }

    // --- Gravity ---
    player.vy += GRAVITY * dt;
    player.vy = Math.min(player.vy, MAX_FALL_SPEED);

    // --- Resolve movement & collisions ---
    moveX(dt);
    moveY(dt);

    // --- Cosmetic animation state ---
    if(player.grounded && Math.abs(player.vx) > 0.1){
      player.legPhase += Math.abs(player.vx) * 0.05 * dt;
    }
    if(player.squashT > 0) player.squashT = Math.max(0, player.squashT - 0.06 * dt);

    player.blinkTimer -= dt / 60;
    if(player.blinkTimer <= 0){ player.blinkT = 0.15; player.blinkTimer = randRange(2,5); }
    if(player.blinkT > 0) player.blinkT -= dt / 60;

    updateCamera(dt);
    checkCoinCollection();
    checkWin();
  }

  function updateCamera(dt){
    const target = player.x + player.w/2 - W/2;
    cameraX += (target - cameraX) * Math.min(1, 0.15 * dt);
    cameraX = Math.max(0, Math.min(cameraX, LEVEL_WIDTH - W));
  }

  function checkCoinCollection(){
    for(const c of coins){
      if(c.collected) continue;
      const dx = (player.x + player.w/2) - c.x;
      const dy = (player.y + player.h/2) - c.y;
      if(Math.hypot(dx, dy) < c.r + 18){
        c.collected = true;
        score++;
        document.getElementById('score').textContent = score;
        playTone(880, 0.1, 'triangle', 0.06);
      }
    }
  }

  function checkWin(){
    if(!won && player.x + player.w >= FLAG_X){
      won = true;
      document.getElementById('win-stats').textContent =
        `You collected ${score} of ${coins.length} stars!`;
      document.getElementById('win-screen').classList.remove('hidden');
      playTone(523,0.12,'triangle',0.06);
      setTimeout(() => playTone(659,0.12,'triangle',0.06), 120);
      setTimeout(() => playTone(784,0.18,'triangle',0.06), 240);
    }
  }


  // ---------------------------------------------------------------
  // 6. SOUND — tiny WebAudio beeps, no external audio files needed
  // ---------------------------------------------------------------
  let audioCtx = null;
  function playTone(freq, duration, type, volume){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.value = volume || 0.06;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration + 0.02);
    } catch(e){ /* audio unavailable — fail silently */ }
  }


  // ---------------------------------------------------------------
  // 7. RENDERING
  // ---------------------------------------------------------------
  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function roundRectCentered(cx, cy, w, h, r){
    roundRect(cx - w/2, cy - h/2, w, h, r);
  }

  function drawSky(){
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0,   '#7ec8ff'); // bright sky blue
    grad.addColorStop(0.7, '#bfe8ff');
    grad.addColorStop(1,   '#eaf9ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // A cheerful sun in the corner.
    ctx.save();
    ctx.translate(W - 90, 80);
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawClouds(){
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for(const c of cloudSpots){
      const sx = c.x - cameraX * 0.4; // slow parallax drift
      if(sx < -120 || sx > W + 120) continue;
      ctx.save();
      ctx.translate(sx, c.y);
      ctx.scale(c.s, c.s);
      ctx.beginPath();
      ctx.arc(0, 0, 20, Math.PI*0.5, Math.PI*1.5);
      ctx.arc(18, -14, 16, Math.PI, Math.PI*2);
      ctx.arc(40, 0, 20, Math.PI*1.5, Math.PI*0.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawHills(){
    ctx.fillStyle = '#9be89b';
    const parallax = 0.6;
    for(let i=0; i < Math.ceil(LEVEL_WIDTH/400)+1; i++){
      const hx = i*400 - cameraX*parallax;
      if(hx < -260 || hx > W + 260) continue;
      ctx.beginPath();
      ctx.ellipse(hx, GROUND_Y+40, 220, 110, 0, Math.PI, 0);
      ctx.fill();
    }
  }

  function drawGround(){
    // Dirt body.
    ctx.fillStyle = '#c68a4e';
    ctx.fillRect(0, GROUND_Y, LEVEL_WIDTH, (H-GROUND_Y)+60);
    // Bright green grass strip on top.
    ctx.fillStyle = '#7ed957';
    ctx.fillRect(0, GROUND_Y, LEVEL_WIDTH, 26);
    // Scalloped grass edge for a soft, cute silhouette.
    ctx.fillStyle = '#8fe86a';
    for(let x=0; x<LEVEL_WIDTH; x+=36){
      ctx.beginPath();
      ctx.arc(x+18, GROUND_Y+2, 18, Math.PI, 0);
      ctx.fill();
    }
    // Dirt speckles for texture (precomputed positions).
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    for(const d of dirtDots){
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawPlatforms(){
    for(const p of platforms){
      // soft drop shadow
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      roundRect(p.x+3, p.y+6, p.w, p.h, 12); ctx.fill();
      // candy-colored body
      ctx.fillStyle = p.color;
      roundRect(p.x, p.y, p.w, p.h, 12); ctx.fill();
      // glossy top highlight
      ctx.fillStyle = p.top;
      roundRect(p.x+4, p.y+4, p.w-8, p.h*0.4, 8); ctx.fill();
      // little grass sprigs poking out the top
      ctx.font = '16px serif';
      ctx.fillText('🌿', p.x+8, p.y-2);
      ctx.fillText('🌿', p.x+p.w-24, p.y-2);
    }
  }

  function drawCoins(t){
    for(const c of coins){
      if(c.collected) continue;
      const bobY   = c.y + Math.sin(t/300 + c.bob) * 4;
      const spin   = Math.abs(Math.sin(t/260 + c.bob));
      ctx.save();
      ctx.translate(c.x, bobY);
      ctx.scale(0.4 + spin*0.6, 1); // fake a spinning-coin effect
      ctx.fillStyle = '#ffd93d';
      ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffec99';
      ctx.beginPath(); ctx.arc(0, 0, c.r*0.55, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  function drawFlag(){
    const poleH = 220;
    const baseY = GROUND_Y;
    ctx.strokeStyle = '#c9c9c9';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(FLAG_X, baseY);
    ctx.lineTo(FLAG_X, baseY - poleH);
    ctx.stroke();
    // gold ball on top
    ctx.fillStyle = '#ffd93d';
    ctx.beginPath(); ctx.arc(FLAG_X, baseY - poleH, 10, 0, Math.PI*2); ctx.fill();
    // gently waving flag
    const wave = Math.sin(Date.now()/200) * 6;
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.moveTo(FLAG_X, baseY - poleH + 16);
    ctx.lineTo(FLAG_X + 46 + wave, baseY - poleH + 30);
    ctx.lineTo(FLAG_X, baseY - poleH + 44);
    ctx.closePath(); ctx.fill();
  }

  function drawPlayer(){
    const cx = player.x + player.w/2;
    const cy = player.y + player.h/2;

    // Squash & stretch gives the jump a springy, cartoony feel.
    let sx = 1, sy = 1;
    if(player.squashT > 0){
      sx = 1 + player.squashT * 0.35;
      sy = 1 - player.squashT * 0.35;
    } else if(!player.grounded){
      if(player.vy < -2){ sx = 0.88; sy = 1.15; }      // stretch going up
      else if(player.vy > 3){ sx = 1.12; sy = 0.88; }  // squash falling
    } else if(Math.abs(player.vx) > 0.2){
      const bob = Math.sin(player.legPhase) * 0.04;    // gentle run bob
      sy = 1 - Math.abs(bob); sx = 1 + Math.abs(bob) * 0.6;
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(player.facing * sx, sy);

    const bw = player.w, bh = player.h;

    // little stepping feet
    const step = player.grounded ? Math.sin(player.legPhase) * 6 : 0;
    ctx.fillStyle = '#e88a3c';
    ctx.beginPath(); ctx.ellipse(-8, bh/2-4 - Math.max(0, step)*0.2, 8, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8,  bh/2-4 + Math.max(0,-step)*0.2, 8, 6, 0, 0, Math.PI*2); ctx.fill();

    // rounded blob body
    ctx.fillStyle = '#ffb84c';
    roundRectCentered(0, 0, bw, bh, 16);
    ctx.fill();

    // ears
    ctx.beginPath(); ctx.arc(-bw/2+6, -bh/2+2, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bw/2-6,  -bh/2+2, 8, 0, Math.PI*2); ctx.fill();

    // rosy cheeks
    ctx.fillStyle = 'rgba(255,120,120,0.5)';
    ctx.beginPath(); ctx.arc(-bw/2+6, 4, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bw/2-6,  4, 5, 0, Math.PI*2); ctx.fill();

    // eyes (with an occasional cute blink)
    if(player.blinkT > 0){
      ctx.strokeStyle = '#3a2e2e'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-2,-4); ctx.lineTo(6,-4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-10,-4); ctx.lineTo(-2,-4); ctx.stroke();
    } else {
      ctx.fillStyle = '#3a2e2e';
      ctx.beginPath(); ctx.arc(4,-4,3.4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-6,-4,3.4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(5,-5.5,1.2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-5,-5.5,1.2,0,Math.PI*2); ctx.fill();
    }

    // smile
    ctx.strokeStyle = '#a85a2b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 2, 5, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();

    ctx.restore();
  }

  function render(t){
    drawSky();
    drawClouds();
    drawHills();

    // Everything below scrolls together with the camera.
    ctx.save();
    ctx.translate(-cameraX, 0);
    drawGround();
    drawPlatforms();
    drawCoins(t);
    drawFlag();
    drawPlayer();
    ctx.restore();
  }


  // ---------------------------------------------------------------
  // 8. MAIN LOOP + UI WIRING
  // ---------------------------------------------------------------
  let lastTime = 0;
  let gameRunning = false;

  function loop(now){
    if(!lastTime) lastTime = now;
    let dt = (now - lastTime) / (1000/60); // normalize to "frames at 60fps"
    dt = Math.min(dt, 2.5);                // clamp so tab-switch lag doesn't teleport the player
    lastTime = now;

    if(gameRunning && !won) update(dt);
    render(now);

    requestAnimationFrame(loop);
  }

  document.getElementById('score-total').textContent = coins.length;

  document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('start-screen').classList.add('hidden');
    gameRunning = true;
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    resetPlayer();
    score = 0; won = false; cameraX = 0;
    coins.forEach(c => c.collected = false);
    document.getElementById('score').textContent = '0';
    document.getElementById('win-screen').classList.add('hidden');
    gameRunning = true;
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
